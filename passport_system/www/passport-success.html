<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم استلام طلبك</title>
<style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    .container { max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
    .success-header { background: #d4edda; color: #155724; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .card { background: #fff; border: 2px solid #28a745; border-radius: 12px; padding: 30px; }
    .ref-number { color: #28a745; font-size: 32px; margin: 10px 0; }
    .qr-image { max-width: 280px; border: 2px solid #ddd; padding: 15px; border-radius: 8px; margin: 15px 0; }
    .btn-print { background: #007bff; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; }
    .error { color: #dc3545; }
    .loading { padding: 40px; }
</style>
</head>
<body>

<div class="container">
    <div id="loading" class="loading">
        <h3>⏳ جاري تحميل طلبك...</h3>
    </div>

    <div id="success-content" style="display:none;">
        <div class="success-header">
            <h2 style="margin: 0;">✅ تم استلام طلبك بنجاح</h2>
        </div>

        <div class="card">
            <p style="color: #666; font-size: 16px;">رقمك المرجعي</p>
            <h1 id="ref-number" class="ref-number"></h1>

            <hr style="margin: 20px 0;">

            <p style="color: #666; font-size: 16px;">أظهر هذا الرمز للموظف عند المراجعة:</p>
            <img id="qr-image" class="qr-image" src="" alt="QR Code">

            <p style="margin-top: 20px;">
                <button onclick="window.print()" class="btn-print">🖨️ طباعة الصفحة</button>
            </p>
        </div>

        <p style="color: #666; font-size: 14px; margin-top: 20px;">
            احتفظ بهذا الرقم المرجعي للاستعلام عن حالة طلبك.
        </p>
    </div>

    <div id="error-content" style="display:none; padding: 40px;">
        <h3 class="error">⚠️ لم نتمكن من العثور على طلبك</h3>
        <p>يرجى التواصل مع الدعم أو المحاولة مرة أخرى.</p>
        <a href="/passport-application" style="color: #007bff;">← العودة للنموذج</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Page loaded, fetching latest passport...');
    
    fetch('/api/method/passport_system.api.get_latest_passport')
        .then(response => response.json())
        .then(data => {
            console.log('API response:', data);
            document.getElementById('loading').style.display = 'none';
            
            if (data.message && data.message.qr_data) {
                document.getElementById('ref-number').textContent = data.message.reference_number;
                document.getElementById('qr-image').src = data.message.qr_data;
                document.getElementById('success-content').style.display = 'block';
            } else {
                document.getElementById('error-content').style.display = 'block';
            }
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-content').style.display = 'block';
        });
});
</script>

</body>
</html>
